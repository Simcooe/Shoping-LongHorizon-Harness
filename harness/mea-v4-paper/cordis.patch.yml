# mea-v4-paper — 论文对齐 profile（阶段1-4接口已实现，阶段5闭环未接通）。
#
# 已具备身份/journal、Task State/reducer、fresh Executor adapter/exporter与独立只读
# Auditor/inspect接口。当前profile仍未接真实Manager调度，因此不能作为完整paper-aligned
# runtime执行正式评测；阶段5应通过controller逐轮调用adapter，而不是在单个DSH session中
# 自行延续历史。
#
# 基底 = dsh-base + dsh-headless。工具面 = shop-tools（search/click/finish/ask_shopper）。
# 后续阶段在此 profile 上继续叠加，不修改 h0/mea-v3。

