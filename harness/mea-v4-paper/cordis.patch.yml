# mea-v4-paper — 论文对齐 profile（阶段1：结构化 Task State / Contract / Audit Reducer）。
#
# 阶段1 只落地纯数据结构、校验器与 reducer（src/mea-v4/），不接真实模型，
# 不改变 mea-v3 runtime。本 profile 目前复用 mea-v3 的 cordis 工具面与 system-prompt
# 骨架，后续阶段（2-6）会逐步引入 AgentAdapter、read-only Auditor、audited purchase、
# 硬预算与 ask route。
#
# 基底 = dsh-base + dsh-headless。工具面 = shop-tools（search/click/finish/ask_shopper）。
# 后续阶段在此 profile 上继续叠加，不修改 h0/mea-v3。

